name: tests

on:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install runtime/test dependencies
        run: python -m pip install --upgrade pip numpy Pillow openpyxl
      - name: Compile Python modules
        run: python -m compileall -q src web_app tests
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
